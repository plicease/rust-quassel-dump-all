name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    name: Check version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          get_version() {
            awk '/^\[package\]/{f=1; next} /^\[/{f=0} f && /^version[[:space:]]*=/{print; exit}' "$1" \
              | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          }

          NEW="$(get_version Cargo.toml)"
          echo "New version: $NEW"

          OLD=""
          if git cat-file -e HEAD~1:Cargo.toml 2>/dev/null; then
            git show HEAD~1:Cargo.toml > /tmp/old-Cargo.toml
            OLD="$(get_version /tmp/old-Cargo.toml)"
          fi
          echo "Old version: $OLD"

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Tag and create release
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create tag and release
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

  build:
    name: Build (${{ matrix.target }})
    needs: [check-version, release]
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (i686-unknown-linux-gnu)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install cross-compiler (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --no-strip
          deb="$(find "target/${{ matrix.target }}/debian" -maxdepth 1 -name '*.deb')"
          echo "DEB_ASSET=$deb" >> "$GITHUB_ENV"

      - name: Upload Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: gh release upload "v$VERSION" "$DEB_ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="quassel-dump-all-v${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/quassel-dump-all" "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="quassel-dump-all-v${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/quassel-dump-all.exe" "$name/"
          cp README.md LICENSE "$name/"
          7z a "${name}.zip" "$name"
          echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          echo "STAGEDIR=$name" >> "$GITHUB_ENV"

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bits=64
          [[ "${{ matrix.target }}" == i686-* ]] && bits=32
          installer="quassel-dump-all-v${VERSION}-${{ matrix.target }}-installer.exe"
          makensis \
            "-DVERSION=$VERSION" \
            "-DBITS=$bits" \
            "-DSRCDIR=$(cygpath -w "$(pwd)/$STAGEDIR")" \
            "-DOUTFILE=$(cygpath -w "$(pwd)/$installer")" \
            packaging/windows/installer.nsi
          echo "INSTALLER_ASSET=$installer" >> "$GITHUB_ENV"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: gh release upload "v$VERSION" "$INSTALLER_ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload asset
        shell: bash
        run: gh release upload "v$VERSION" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
